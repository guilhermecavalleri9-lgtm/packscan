<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mandato Presidencial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg:#0B1418; --bg2:#0F1C21; --bg3:#152830; --bg4:#1B323B;
  --line:#203740; --line2:#2D4A55;
  --ink:#E9E3D1; --ink2:#AAB8B6; --ink3:#71868B;
  --gold:#E2B54E; --gold-d:#8F6F26; --gold-bg:rgba(226,181,78,.12);
  --good:#63BA8C; --bad:#E36C55; --warn:#E3A04A; --info:#6FAFD0;
  --serif:"Newsreader", Georgia, "Times New Roman", serif;
  --ui:"IBM Plex Sans Condensed", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:6px;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.4}
*{box-sizing:border-box}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
#app{height:100%;display:grid;grid-template-rows:auto 1fr;min-height:0}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:16px;padding:10px 16px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0F1D22,#0B1418)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.seal{width:34px;height:34px;flex:none;border-radius:50%;border:1.5px solid var(--gold);display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#1d3a43,#0d1a1f)}
.seal svg{width:20px;height:20px}
.brand .t{font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:.01em;line-height:1.1}
.brand .sub{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.date{display:flex;flex-direction:column;line-height:1.15;padding-left:14px;border-left:1px solid var(--line)}
.date b{font-family:var(--serif);font-weight:600;font-size:16px}
.date span{font-size:12px;color:var(--ink3)}
.kpis{flex:1;display:flex;gap:4px;overflow-x:auto;min-width:0;scrollbar-width:none}
.kpis::-webkit-scrollbar{display:none}
.kpi{flex:none;padding:3px 10px;border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:78px}
.kpi .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);white-space:nowrap}
.kpi .v{font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .d{font-family:var(--mono);font-size:11px}
.up{color:var(--good)} .dn{color:var(--bad)} .flat{color:var(--ink3)}
.primary{background:var(--gold);color:#1a1405;border:0;border-radius:var(--r);padding:10px 16px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.primary:hover{filter:brightness(1.08)}
.primary:disabled{opacity:.5;cursor:wait}

/* ---------- main ---------- */
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(400px,520px);min-height:0}
.panel,.stage,.top>*{min-width:0}
.stage{position:relative;min-height:0;overflow:hidden;background:radial-gradient(ellipse at 45% 50%,#12252c 0%,#0B1418 70%)}
#globe{position:absolute;inset:0}
.mapmodes{position:absolute;top:12px;left:12px;display:flex;gap:4px;flex-wrap:wrap;z-index:2}
.chip{background:rgba(15,28,33,.85);border:1px solid var(--line2);border-radius:999px;padding:5px 11px;font-size:12.5px;color:var(--ink2)}
.chip[aria-pressed="true"]{border-color:var(--gold);color:var(--gold);background:rgba(40,32,12,.8)}
.legend{position:absolute;left:12px;bottom:12px;z-index:2;background:rgba(11,20,24,.82);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;font-size:12px;color:var(--ink2);display:flex;flex-direction:column;gap:4px;max-width:250px}
.legend .row{display:flex;align-items:center;gap:6px}
.sw{width:11px;height:11px;border-radius:2px;flex:none}
.grad{height:8px;border-radius:4px;background:linear-gradient(90deg,#B8412F,#3A4C52,#3F9C6E);width:180px}
.ticker{position:absolute;right:12px;bottom:12px;left:auto;z-index:2;max-width:min(420px,60%);display:flex;flex-direction:column;gap:6px;pointer-events:none}
.tick{background:rgba(11,20,24,.88);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:4px;padding:7px 10px;font-family:var(--serif);font-size:14px;line-height:1.3;animation:tin .5s ease both}
.tick small{display:block;font-family:var(--ui);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.tick.neg{border-left-color:var(--bad)} .tick.pos{border-left-color:var(--good)}
@keyframes tin{from{transform:translateY(6px);opacity:.3}to{transform:none;opacity:1}}
.float-tooltip-kap{background:rgba(11,20,24,.95)!important;border:1px solid var(--line2);border-radius:6px;padding:7px 10px!important;font-family:var(--ui)!important;font-size:12.5px!important;color:var(--ink)!important}
.float-tooltip-kap b{font-family:var(--serif);font-size:14px}

/* ---------- panel ---------- */
.panel{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line);background:var(--bg2)}
.tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:thin;flex:none}
.tabs button{flex:none;background:none;border:0;border-bottom:2px solid transparent;padding:10px 8px 8px;color:var(--ink3);font-size:13px;font-weight:500;letter-spacing:.02em;position:relative}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.tabs button .dot{position:absolute;top:7px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--bad)}
.body{flex:1;overflow-y:auto;padding:14px 16px 40px;display:flex;flex-direction:column;gap:18px}
h2{font-family:var(--serif);font-weight:600;font-size:20px;margin:0;text-wrap:balance;line-height:1.15}
h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink3);margin:0 0 8px;font-weight:600;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h3 em{font-style:normal;text-transform:none;letter-spacing:0;color:var(--ink3);font-weight:400;font-size:12px}
p{margin:0}
.muted{color:var(--ink3)} .small{font-size:12.5px}
.sec{display:flex;flex-direction:column;gap:8px}
.box{background:var(--bg3);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg3);border:1px solid var(--line);border-radius:var(--r);padding:9px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .l{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em}
.stat .v{font-family:var(--mono);font-size:17px;font-variant-numeric:tabular-nums}
.stat svg{display:block;width:100%;height:30px;margin-top:3px}
.btn{background:var(--bg4);border:1px solid var(--line2);border-radius:var(--r);padding:7px 11px;font-size:13px;color:var(--ink)}
.btn:hover{border-color:var(--gold-d)}
.btn.gold{border-color:var(--gold-d);color:var(--gold)}
.btn.danger{border-color:#6b2e24;color:#F08B75}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.row{display:flex;align-items:center;gap:8px}
.sp{flex:1}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line2);color:var(--ink2);white-space:nowrap}
.pill.good{border-color:#2f6a4c;color:var(--good)} .pill.bad{border-color:#743427;color:var(--bad)} .pill.warn{border-color:#6f5222;color:var(--warn)} .pill.gold{border-color:var(--gold-d);color:var(--gold)}

/* sliders */
.sl{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.sl label{font-size:13px}
.sl output{font-family:var(--mono);font-size:13px;color:var(--gold);text-align:right;font-variant-numeric:tabular-nums}
.sl input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--gold);height:18px}
.sl .hint{grid-column:1/-1;font-size:11.5px;color:var(--ink3)}
select{background:var(--bg4);border:1px solid var(--line2);border-radius:4px;padding:4px 6px;font-size:12.5px;max-width:100%}
textarea,input[type=text]{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:var(--r);padding:9px 10px;font-size:14px;line-height:1.4}
textarea{min-height:92px;resize:vertical;font-family:var(--serif);font-size:15px}

/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-weight:500;color:var(--ink3);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:5px 4px;border-bottom:1px solid var(--line2)}
td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
tr.click{cursor:pointer} tr.click:hover td{background:var(--bg3)}

/* bars */
.bar{height:6px;border-radius:3px;background:var(--bg4);overflow:hidden;position:relative}
.bar i{position:absolute;top:0;bottom:0;left:0;border-radius:3px}
.hb{display:grid;grid-template-columns:110px 1fr 42px;gap:8px;align-items:center;font-size:12.5px;padding:2px 0}
.hb .bar{height:9px}
.stack{display:flex;height:14px;border-radius:3px;overflow:hidden;gap:1px}
.stack i{display:block;height:100%}

/* feed */
.feed{display:flex;flex-direction:column;gap:8px}
.news{border-left:3px solid var(--line2);padding:2px 0 2px 10px}
.news.neg{border-left-color:var(--bad)} .news.pos{border-left-color:var(--good)}
.news small{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.news p{font-family:var(--serif);font-size:16px;line-height:1.25}
.post{display:grid;grid-template-columns:34px 1fr;gap:9px;padding:9px 0;border-bottom:1px solid var(--line)}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;color:#10181b}
.post .who{font-size:12.5px;color:var(--ink2)} .post .who b{color:var(--ink)}
.post p{font-size:14px;margin-top:2px}
.post .meta{font-size:11.5px;color:var(--ink3);margin-top:3px}

/* laws */
.law{background:var(--bg3);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.law .n{font-family:var(--serif);font-size:16px;font-weight:600;line-height:1.2}
.law .fx{display:flex;flex-wrap:wrap;gap:4px}
.decree{background:#EFE8D4;color:#1E1B14;border-radius:4px;padding:14px 16px;font-family:var(--serif);display:flex;flex-direction:column;gap:8px;box-shadow:0 1px 0 rgba(0,0,0,.4)}
.decree .hd{font-family:var(--ui);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#6A5A2F;border-bottom:1px solid #CFC39F;padding-bottom:6px;display:flex;justify-content:space-between}
.decree h4{margin:0;font-size:19px;line-height:1.2}
.decree p{font-size:14.5px;line-height:1.4}
.decree .fx .pill{border-color:#BBAE88;color:#3b3526}
.decree .fx .pill.good{color:#1f6a43;border-color:#8fbfa3} .decree .fx .pill.bad{color:#9a2f1d;border-color:#d99a8c}
.decree .btn{background:#1E1B14;color:#EFE8D4;border-color:#1E1B14}
.decree .btn.alt{background:transparent;color:#1E1B14;border-color:#8b7d55}

/* chat */
.chat{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto;padding-right:4px}
.msg{padding:8px 11px;border-radius:10px;max-width:88%;font-size:14px;line-height:1.4;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--gold-bg);border:1px solid var(--gold-d)}
.msg.them{align-self:flex-start;background:var(--bg4);border:1px solid var(--line2)}
.msg.sys{align-self:center;font-size:12px;color:var(--ink3);background:none;padding:2px}

/* people */
.cit{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.cit .av{width:40px;height:40px;font-size:14px}
.cit .nm{font-weight:600}
.cit .ds{font-size:12px;color:var(--ink3)}
.mood{font-family:var(--mono);font-size:13px}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(5,10,12,.72);display:grid;place-items:center;padding:16px;backdrop-filter:blur(2px)}
.card{background:var(--bg2);border:1px solid var(--line2);border-radius:10px;max-width:560px;width:100%;max-height:calc(100% - 20px);overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.card .kick{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.card h2{font-size:25px}
.card p.lead{font-family:var(--serif);font-size:16.5px;line-height:1.4;color:var(--ink)}
.opt{display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--bg3);border:1px solid var(--line2);border-radius:var(--r);padding:10px 12px}
.opt:hover{border-color:var(--gold)}
.opt b{font-weight:600;font-size:14.5px}
.opt span{font-size:12.5px;color:var(--ink3)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{background:var(--bg3);border:1px solid var(--line2);border-radius:var(--r);padding:10px 8px;text-align:left;display:flex;flex-direction:column;gap:2px}
.seg button[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-bg)}
.seg b{font-size:14px} .seg span{font-size:11.5px;color:var(--ink3)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--bg4);border:1px solid var(--gold-d);color:var(--ink);padding:9px 14px;border-radius:8px;font-size:13.5px;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.4)}
.ai{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink3)}
.ai i{width:7px;height:7px;border-radius:50%;background:var(--ink3)}
.ai.on i{background:var(--good);box-shadow:0 0 6px var(--good)}
.ai.busy i{background:var(--gold);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.warbar{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--bad) 0 50%,var(--good) 50% 100%);position:relative;opacity:.9}
.warbar b{position:absolute;top:-3px;width:4px;height:18px;background:var(--ink);border-radius:2px;transform:translateX(-2px)}

@media (max-width: 900px){
  #app{height:auto;min-height:100%}
  html,body{height:auto}
  .top{flex-wrap:wrap;gap:10px}
  .kpis{order:3;flex-basis:100%}
  .top .primary{order:2}
  .date{border-left:0;padding-left:0}
  .top .primary{margin-left:auto}
  main{grid-template-columns:minmax(0,1fr)}
  .stage{height:52vh;min-height:320px}
  .panel{border-left:0;border-top:1px solid var(--line)}
  .body{overflow:visible}
  .ticker{max-width:calc(100% - 24px);left:12px;right:12px;bottom:12px}
  .legend{display:none}
  .tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg2)}
}
@media (max-width:480px){
  .grid3{grid-template-columns:1fr 1fr}
  .seg{grid-template-columns:1fr}
  .brand .sub{max-width:160px}
  .hb{grid-template-columns:90px 1fr 38px}
}
@media (prefers-reduced-motion: reduce){ .tick{animation:none} .ai.busy i{animation:none} }
</style>

<div id="app">
  <header class="top">
    <div class="brand">
      <div class="seal" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M10 1.8l2.2 5 5.4.4-4.1 3.5 1.3 5.3L10 13.2 5.2 16l1.3-5.3L2.4 7.2l5.4-.4z" fill="none" stroke="#E2B54E" stroke-width="1.2"/></svg></div>
      <div><div class="t">Mandato Presidencial</div><div class="sub" id="presName">República Federativa do Brasil</div></div>
    </div>
    <div class="date"><b id="dateLbl">janeiro de 2027</b><span id="electLbl"></span></div>
    <div class="kpis" id="kpis"></div>
    <button id="nextBtn" class="primary">Encerrar o mês</button>
  </header>
  <main>
    <section class="stage" aria-label="Globo">
      <div id="globe"></div>
      <div class="mapmodes" id="mapmodes">
        <button class="chip" data-mode="rel" aria-pressed="true">Relações</button>
        <button class="chip" data-mode="blocos" aria-pressed="false">Blocos</button>
        <button class="chip" data-mode="comercio" aria-pressed="false">Comércio</button>
        <button class="chip" data-mode="militar" aria-pressed="false">Poder militar</button>
      </div>
      <div class="legend" id="legend"></div>
      <div class="ticker" id="ticker"></div>
    </section>
    <aside class="panel">
      <nav class="tabs" id="tabs" role="tablist"></nav>
      <div class="body" id="body"></div>
    </aside>
  </main>
</div>
<div class="modal" id="modal" hidden><div class="card" id="modalCard"></div></div>
<div class="toast" id="toast" hidden></div>

  approval();
  pushHist();
  S.featured=pickFeatured();
}

/* ---------- população (agentes) ---------- */
const DECIL_RENDA=[420,780,1100,1450,1800,2300,3000,4200,6800,19000];
function genAgents(n){
  A=[];
  const regK=Object.keys(REGIOES);
  for(let i=0;i<n;i++){
    let r=rnd(),reg='SE',acc=0;for(const k of regK){acc+=REGIOES[k].p;if(r<acc){reg=k;break}}
    const sexo=rnd()<.52?'F':'M';
    const idade=Math.round(clamp(16+Math.abs(gauss())*22+rnd()*12,16,88));
    const skew={N:-1.2,NE:-1.6,CO:.4,SE:.7,S:.8}[reg];
    const d=clamp(Math.floor(4.5+skew+gauss()*2.6),0,9);
    let st;
    if(idade>=62&&rnd()<.85)st='aposentado';
    else if(idade<22&&rnd()<.45)st='estudante';
    else{const x=rnd();
      const agroP=(reg==='CO'||reg==='S')?.13:.06;
      if(x<.11)st='servidor';else if(x<.11+(d>=6?.12:.04))st='empresario';else if(x<.11+(d>=6?.12:.04)+agroP)st='agro';else if(x<.62)st='formal';else st='informal'}
    const a={id:i,sexo,idade,reg,cid:pick(REGIOES[reg].cid),d,st,
      nome:(sexo==='F'?pick(NOMES_F):pick(NOMES_M))+' '+pick(SOBRENOMES),
      benef:d<=2&&rnd()<.72, evang:rnd()<({N:.36,NE:.26,CO:.34,SE:.28,S:.24}[reg]),
      mil:idade>19&&idade<58&&rnd()<.022, amb:rnd()<(idade<30?.13:.05)+(d>6?.05:0),
      pers:gauss()*6, sat:50, hist:[], w:null, ocup:''};
    a.ideo=clamp(gauss()*.45+({N:0,NE:-.28,CO:.28,SE:.05,S:.22}[reg])+(a.evang?.3:0)+(d>=8?.15:d<=2?-.1:0)+(st==='agro'?.3:0)+(st==='servidor'?-.15:0)+(idade<30?-.12:0)+(a.mil?.35:0)+(a.amb?-.3:0),-1,1);
    a.renda=Math.round(DECIL_RENDA[d]*(.8+rnd()*.45)/10)*10;
    const w={infl:1.2+(d<5?.8:0),emp:1+(d<6?.6:0)+(idade<30?.4:0),crime:1+(d>6?.4:0),saude:1+(idade>50?.6:0)+(d<5?.3:0),educ:.6+(idade<30?.6:0),corrup:.8+(d>5?.5:0),amb:a.amb?2.2:.25,cost:a.evang?1.6:.6,imp:d>=7?1.4:.5};
    for(const k in w)w[k]*=.7+rnd()*.6;
    a.w=w;
    if(st==='aposentado'){a.renda=Math.max(1630,a.renda)}
    setOcup(a);
    a.g=groupsOf(a);
    A.push(a);
  }
  // desemprego inicial
  const lf=A.filter(a=>a.st==='formal'||a.st==='informal');
  const target=Math.round((lf.length)*.058);
  for(let k=0;k<target;k++){const a=pick(lf);if(a.st!=='desempregado'){a.prevSt=a.st;a.st='desempregado';a.ocup='procurando emprego';a.g=groupsOf(a)}}
  const pi=S.pres.ideo;
  for(const a of A)a.sat=clamp(54+a.pers*1.4+30*(.55-Math.abs(a.ideo-pi)),5,95);
}
function setOcup(a){
  if(a.st==='aposentado'){a.ocup=a.d<4?'aposentado pelo INSS':'aposentado';return}
  if(a.st==='estudante'){a.ocup=a.d<5?'estudante de escola pública':'estudante universitário';return}
  if(a.st==='desempregado'){a.ocup='procurando emprego';return}
  const tbl=OCUP[a.st]||OCUP.formal;
  for(const [lo,hi,list] of tbl){if(a.d>=lo&&a.d<hi){a.ocup=pick(list);return}}
  a.ocup=pick(tbl[tbl.length-1][2]);
}
function groupsOf(a){
  const g=[];
  if(a.d<=2)g.push('pobres');else if(a.d>=3&&a.d<=7)g.push('classe_media');if(a.d>=9)g.push('ricos');
  if(a.st==='empresario')g.push('empresarios');if(a.st==='agro')g.push('agro');if(a.st==='servidor')g.push('servidores');
  if(a.st==='formal')g.push('trabalhadores');if(a.evang)g.push('evangelicos');if(a.idade<30)g.push('jovens');
  if(a.st==='aposentado')g.push('aposentados');if(a.mil)g.push('militares');if(a.amb)g.push('ambientalistas');
  return g;
}
function pickFeatured(){
  const want=[a=>a.reg==='NE'&&a.d<=2,a=>a.reg==='SE'&&a.st==='formal',a=>a.st==='agro'&&a.d>=6,a=>a.idade<27&&a.st!=='aposentado',a=>a.st==='aposentado',a=>a.st==='empresario',a=>a.reg==='S'&&a.st==='informal',a=>a.st==='servidor'];
  const out=[];for(const f of want){const c=A.filter(f).filter(a=>!out.includes(a.id));if(c.length)out.push(pick(c).id)}
  return out;
}

/* ---------- utilidades de estado ---------- */
function pulse(k,amt,months){S.pulses.push({k,amt,left:months})}
function pulseSum(k){return S.pulses.filter(p=>p.k===k).reduce((a,p)=>a+p.amt,0)}
function moodG(o){for(const k in o){if(k==='all')S.moodAll+=o[k];else S.moodG[k]=(S.moodG[k]||0)+o[k]}}
function moodR(r,v){S.moodR[r]=(S.moodR[r]||0)+v}
function oneOff(bi){S.e.divida+=bi/(S.e.pibNom*1000)*100;S.e.oneoffM=(S.e.oneoffM||0)+bi}
function relC(iso,d,perm){if(iso==='UE'){EU.forEach(i=>relC(i,d,perm));return}const st=S.c[iso];if(!st)return;st.rel=clamp(st.rel+d,-100,100);if(perm)st.mod+=d*.6}
function log(t){S.log.push(t)}
function lawSum(k){let s=0;for(const l of S.leis.vigor){if(l.fx&&l.fx[k])s+=l.fx[k]*(l.prog??1)}return s}
function pctPIB(bi){return bi/(S.e.pibReal*1000)*100}
function tariffOf(k){return TARIFF[S.pol.imp[k]]}
function atWar(iso){return S.wars.some(w=>w.iso===iso)}

/* ---------- fiscal ---------- */
function calcFiscal(pol=S.pol){
  const e=S.e,t=pol.tax;
  const rec={
    'IR pessoa física':2.6*Math.pow(t.irpf/27.5,.85)*(1-Math.max(0,t.irpf-35)*.012)-(t.isencao-5000)/1000*.12,
    'IR empresas + CSLL':3.3*Math.pow(t.irpj/34,.8)*(1-Math.max(0,t.irpj-40)*.012),
    'Consumo (CBS/IVA)':4.2*t.iva/26.5,
    'Contribuição sobre a folha':5.6*t.folha/20,
    'Outras receitas':3.6+tradeRevenue(pol)+lawSum('receita')};
  let receita=0;for(const k in rec)receita+=rec[k];
  const disc={};let sd=0;for(const g of GASTOS){disc[g.n]=pctPIB(pol.g[g.k]);sd+=disc[g.n]}
  const prev=8.0+e.prevAge+e.smReal*.05;
  let progCost=0;for(const k in S.mil.prog){const p=S.mil.prog[k];if(p.left>0)progCost+=pctPIB(p.cost/p.total*12)}
  const war=S.wars.length?.8:0;
  const subsid=e.subsid||0;
  const desp={'Previdência (INSS)':prev,'Pessoal civil':2.6+e.pessoalAdj,'Outras obrigatórias':1.7+lawSum('gasto')+(S.mil.mobil?.5:0),'Subsídios de preços':subsid,'Programas de defesa':progCost,'Esforço de guerra':war};
  let despesa=sd;for(const k in desp)despesa+=desp[k];
  const primario=receita-despesa;
  const juros=e.divida*e.rEff/100*.85;
  return {rec,disc,desp,receita,despesa,primario,juros,nominal:primario-juros};
}
function tradeRevenue(pol){
  let r=0;for(const s of SECT){const t=TARIFF[pol.imp[s.k]];if(t>=100)continue;const vol=1-(t-11.5)*.012;r+=s.imp*11.7*(t-11.5)/100*vol*.45}
  for(const s of SECT){if(pol.exp[s.k]==='taxa')r+=s.exp*14.8*.15*.85}
  return r;
}

/* ---------- comércio ---------- */
function tradeCalc(){
  const e=S.e,w=S.w,pol=S.pol;
  const oilF=w.oil/65, commF=1+(w.chinaG-4.3)*.04;
  const expF=s=>{const p=pol.exp[s];return p==='livre'?1:p==='taxa'?.85:0};
  const impVol=(s,extra)=>{const t=tariffOf(s)+(extra||0);return t>=100?0:clamp(1-(t-11.5)*.012,.2,1.2)};
  let x=0,m=0;
  const rows={};
  for(const c of COUNTRIES){
    const st=S.c[c.iso];
    const relF=.9+.2*(st.rel+100)/200;
    let sf=st.st==='acordo'?1.12:st.st==='sancao'?.6:st.st==='embargo'?0:1;
    if(atWar(c.iso))sf=0;
    let ep=0;for(const s in c.exp){ep+=c.exp[s]*expF(s)*(s==='petroleo'?oilF:(s==='agro'||s==='minerio')?commF:1)}
    const dem=c.iso==='156'?1+(w.chinaG-4.3)*.05:1+(w.worldG-3)*.03;
    const xv=c.x*relF*sf*ep*(1-.35*st.retal)*(1-.5*st.sancBR)*dem;
    let ip=0;for(const s in c.imp){ip+=c.imp[s]*(st.st==='acordo'?impVol(s,-tariffOf(s)*.999+(tariffOf(s)>=100?100:0)):impVol(s,st.st==='sancao'?50:0))}
    const mv=c.m*ip*(st.st==='embargo'||atWar(c.iso)?0:1)*(e.cresc>0?1+(e.cresc-2)*.02:1);
    rows[c.iso]={x:xv,m:mv};x+=xv;m+=mv;
  }
  // resto do mundo
  let epR=0,ipR=0;for(const s of SECT){epR+=s.exp*expF(s.k)*(s.k==='petroleo'?oilF:1);ipR+=s.imp*impVol(s.k)}
  x+=(EXP_TOTAL-EXP_LISTED)*epR*(1+(w.worldG-3)*.03);m+=(IMP_TOTAL-IMP_LISTED)*ipR;
  e.expUS=x;e.impUS=m;
  const tgt=x/EXP_TOTAL;e.expIdx+=(tgt-e.expIdx)*.35;e.impIdx+=(m/IMP_TOTAL-e.impIdx)*.35;
  S.tradeRows=rows;
}

/* ---------- reação à mudança de políticas ---------- */
function policyChanges(){
  const L=S.last,P=S.pol;
  // tarifas
  let dPrice=0,dGrow=0;
  for(const s of SECT){
    const a=TARIFF[L.imp[s.k]],b=TARIFF[P.imp[s.k]];
    if(a!==b){
      dPrice+=s.imp*(Math.min(b,60)-Math.min(a,60))/100*.15*.7*100;
      if(b>=100&&s.ind)dGrow-=s.imp*4;
      if(b>=100&&s.k==='quimica')pulse('item:cesta',3,10);
      if(b>=100&&s.k==='petroleo')pulse('item:combustivel',8,8);
      log(`Importação de ${s.n.toLowerCase()}: ${TARIFF_N[L.imp[s.k]]} → ${TARIFF_N[P.imp[s.k]]}`);
      if(b>a&&s.ind)moodG({trabalhadores:2,empresarios:1,classe_media:-1});
      if(b<a&&s.ind)moodG({trabalhadores:-2,classe_media:1});
    }
    const ea=L.exp[s.k],eb=P.exp[s.k];
    if(ea!==eb){
      log(`Exportação de ${s.n.toLowerCase()}: ${EXPPOL_N[ea]} → ${EXPPOL_N[eb]}`);
      const sev={livre:0,taxa:1,proibido:3}[eb]-{livre:0,taxa:1,proibido:3}[ea];
      if(s.k==='agro'){pulse('item:cesta',-2.2*sev,12);moodG({agro:-9*sev,pobres:2*sev})}
      if(s.k==='petroleo')pulse('item:combustivel',-3*sev,12);
      if(s.k==='minerio'||s.k==='petroleo')moodG({empresarios:-3*sev});
      for(const c of COUNTRIES)if(c.exp[s.k])relC(c.iso,-c.exp[s.k]*8*sev);
    }
  }
  if(Math.abs(dPrice)>.01)pulse('infl',dPrice,12);
  if(dGrow)pulse('cresc',dGrow,8);
  // preços
  for(const p of PRECOS){
    const a=L.precos[p.k],b=P.precos[p.k];
    if(a===b)continue;
    const st=S.precos[p.k];
    log(`${p.n}: ${({livre:'preço livre',congelado:'preço congelado',teto:'reajuste limitado (tabelamento)',subsidio:'subsídio do Tesouro'})[b]}`);
    if(b==='livre'&&st.rep>0){pulse('item:'+p.k,st.rep,4*3);st.rep=0}
    if(b==='congelado'){moodG({empresarios:-4});S.e.cred-=3}
    if(b==='congelado'||b==='subsidio')moodG({pobres:3,classe_media:2});
  }
  // impostos, gastos, SM
  const t0=L.tax,t1=P.tax;
  const names={irpf:'Alíquota máxima do IR',isencao:'Faixa de isenção do IR',irpj:'IR das empresas + CSLL',iva:'Imposto sobre consumo',folha:'Contribuição sobre a folha'};
  for(const k in t1)if(t0[k]!==t1[k]){
    log(`${names[k]}: ${fmtN(t0[k],k==='isencao'?0:1)} → ${fmtN(t1[k],k==='isencao'?0:1)}`);
    const d=t1[k]-t0[k];
    if(k==='iva'){pulse('infl',d*.25,12);moodG({pobres:-d*1.2,classe_media:-d*1})}
    if(k==='irpf')moodG({ricos:-d*1.2,classe_media:-d*.4});
    if(k==='isencao')moodG({classe_media:d/1000*2.5,trabalhadores:d/1000*2});
    if(k==='irpj'){moodG({empresarios:-d*1.2});S.e.conf-=d*.5}
    if(k==='folha'){moodG({empresarios:-d*1,trabalhadores:-d*.3});pulse('desemp',d*.03,24)}
  }
  for(const g of GASTOS){const a=L.g[g.k],b=P.g[g.k];if(a!==b){
    log(`${g.n}: R$ ${Math.round(a)} bi → R$ ${Math.round(b)} bi`);
    const r=(b-a)/a;
    const map={saude:{all:3,aposentados:3,pobres:3},educacao:{jovens:5,classe_media:2},social:{pobres:10,classe_media:-1,ricos:-2},seguranca:{militares:5,classe_media:2},defesa:{militares:8},infra:{empresarios:3,trabalhadores:2},ciencia:{jovens:2},ambiente:{ambientalistas:6,agro:-2}}[g.k];
    const o={};for(const q in map)o[q]=map[q]*clamp(r*3,-3,3);moodG(o);
  }}
  if(P.sm!==L.sm){
    const chg=(P.sm/L.sm-1)*100;
    S.e.smReal+=chg;S.e.sm=P.sm;
    log(`Salário mínimo: R$ ${fmtN(L.sm,0)} → R$ ${fmtN(P.sm,0)}`);
    pulse('infl',chg*.035,12);pulse('desemp',chg*.02,18);moodG({pobres:chg*1.2,aposentados:chg*1.3,trabalhadores:chg*.6,empresarios:-chg*.6});
  }
  if(!S.flags.bcAut&&P.selic!==L.selic)log(`Selic definida pelo governo: ${fmtN(L.selic,2)}% → ${fmtN(P.selic,2)}%`);
  S.last=JSON.parse(JSON.stringify(P));
}

/* ---------- preços e congelamentos ---------- */
function pricesStep(){
  const e=S.e;
  const oil12=S.w.oil12.length>=12?S.w.oil12[S.w.oil12.length-12]:65;
  let ipca=e.infl*(1-PRECOS.reduce((a,p)=>a+p.w,0)),short=0,sw=0,subsid=0;
  for(const p of PRECOS){
    const st=S.precos[p.k];
    let pi=e.infl+pulseSum('item:'+p.k);
    if(p.k==='combustivel')pi+=(S.w.oil/oil12-1)*100*.35+(e.cambio/(S.hist.cambio?.[Math.max(0,S.hist.cambio.length-12)]||e.cambio)-1)*100*.3;
    if(p.k==='cesta')pi+=(e.cambio/(S.hist.cambio?.[Math.max(0,S.hist.cambio.length-12)]||e.cambio)-1)*100*.2;
    if(p.k==='energia')pi+=.8;
    if(p.k==='remedios')pi+=.3;
    st.pi=pi;
    const mode=S.pol.precos[p.k];
    let eff=pi;
    if(mode==='congelado'){eff=0;st.rep+=Math.max(0,pi)/12;st.short=clamp(st.short+Math.max(0,st.rep-1.5)*1.1+.6,0,100)}
    else if(mode==='teto'){eff=Math.min(pi,pi*.5);st.rep+=Math.max(0,pi-eff)/12;st.short=clamp(st.short+Math.max(0,st.rep-3)*.5,0,100)}
    else if(mode==='subsidio'){eff=Math.min(pi,1);st.rep+=Math.max(0,pi-eff)/12;st.short=Math.max(0,st.short*.7);subsid+=p.w*.65*st.rep}
    else{st.short=Math.max(0,st.short*.72-1)}
    st.eff=eff;
    ipca+=p.w*eff;
    short+=p.w*st.short;sw+=p.w;
  }
  e.shortIdx=short/sw;
  e.subsid=subsid;
  ipca+=pulseSum('infl');
  e.ipca=ipca;
  if(S.pol.precos.combustivel==='congelado'&&S.precos.combustivel.rep>4){e.cred-=.4;e.conf-=.3}
}

/* ---------- macroeconomia ---------- */
function macroStep(){
  const e=S.e,w=S.w;
  const F=calcFiscal();
  e.receita=F.receita;e.despesa=F.despesa;e.primario=F.primario;e.juros=F.juros;e.nominal=F.nominal;
  // impulso fiscal = déficit atual vs média recente
  const def=-F.primario;const imp=def-e.defEma;e.defEma+=(def-e.defEma)*.06;
  // juros
  const expInfl=e.infl*.6+(3+(100-e.cred)*.035)*.4;
  if(S.flags.bcAut){
    const star=4.75+expInfl+1.5*(e.ipca-3)+.35*e.gap;
    const step=clamp(star-e.selic,-.5,.5);
    e.selic=Math.round((e.selic+step)*4)/4;e.selic=clamp(e.selic,2,30);
    S.pol.selic=e.selic;S.last.selic=e.selic;
  }else{e.selic=S.pol.selic}
  e.rEff+=(e.selic-e.rEff)*.05;
  const rr=e.selic-expInfl;e.rrEma+=(rr-e.rrEma)*.12;
  // potencial
  let tarAvg=0;for(const s of SECT)tarAvg+=s.imp*Math.min(tariffOf(s.k),60);
  const fta=Object.values(S.c).filter(c=>c.st==='acordo').length;
  e.pot=2.2+lawSum('pot')+(e.educ-50)*.01+(pctPIB(S.pol.g.infra)-.66)*.6+(pctPIB(S.pol.g.ciencia)-.18)*.8-(tarAvg-11.5)*.012+fta*.02+(S.flags.ocdeOn?.1:0);
  // crescimento
  const exp12=S.hist.expIdx&&S.hist.expIdx.length>=12?S.hist.expIdx[S.hist.expIdx.length-12]:1;
  const tradeT=(e.expIdx-exp12)*15*.8;
  const worldT=(w.worldG-3)*.35+(w.chinaG-4.3)*.15;
  const warT=S.wars.reduce((a,x)=>a+(CBY[x.iso].viz?2.2:1.0),0);
  const taxT=-(S.pol.tax.irpj-34)*.03-(S.pol.tax.iva-26.5)*.05;
  let g=e.pot+.5*imp-.33*(e.rrEma-5)+(e.conf-50)*.04+tradeT+worldT-e.shortIdx*.045-warT+taxT+pulseSum('cresc');
  e.cresc+=(g-e.cresc)*.22;
  e.cresc=clamp(e.cresc,-12,12);
  e.gap+=(e.cresc-e.pot)/12;e.gap*=.985;
  e.pibReal*=1+e.cresc/1200;
  e.pibNom*=1+(e.cresc+e.ipca)/1200;
  // inflação núcleo
  const anchor=3+(100-e.cred)*.035;
  const c12=S.hist.cambio&&S.hist.cambio.length>=12?S.hist.cambio[S.hist.cambio.length-12]:e.cambio;
  const fx=(e.cambio/c12-1)*100*.1;
  const tgt=anchor+.35*e.gap+fx+.12*imp+lawSum('infl')+(S.wars.length?.6:0);
  e.infl+=(tgt-e.infl)*.12;
  e.infl=clamp(e.infl,-3,80);
  // câmbio
  const riskPrem=.015*(55-e.cred)+.008*(e.divida-80)-.03*(rr-7)-.25*(e.expIdx-1)+(S.wars.length?.06:0)+pulseSum('cambio');
  const ct=5.40*Math.exp(riskPrem)*Math.pow((1+e.ipca/100)/(1.025),S.m/12);
  e.cambio+=(ct-e.cambio)*.15;e.cambio*=1+gauss()*.012;e.cambio=clamp(e.cambio,2.5,40);
  // desemprego
  const nat=6.5+lawSum('desemp')+(S.pol.tax.folha-20)*.05;
  e.desemp+=-.045*(e.cresc-1.6)+.012*(nat-e.desemp)+pulseSum('desemp')/12-(S.mil.mobil?.03:0);
  e.desemp=clamp(e.desemp,2,35);
  // dívida
  const ng=e.cresc+e.ipca;
  e.divida+=(F.juros-F.primario)/12-e.divida*(ng/100)/12;
  e.divida=clamp(e.divida,5,300);
  e.reservas=clamp(e.reservas+(e.expUS-e.impUS-40)/12*.25,5,900);
  // credibilidade e confiança
  const credT=55+(F.primario+.5)*6-(e.divida-80)*.45+(S.flags.bcAut?5:-15)+lawSum('cred')-Object.values(S.pol.precos).filter(v=>v==='congelado').length*3-(e.ipca>6?(e.ipca-6)*2:0)+(S.flags.ocdeOn?5:0);
  e.cred+=(clamp(credT,0,100)-e.cred)*.08;e.cred=clamp(e.cred,0,100);
  const confT=50+(e.cred-55)*.5+(e.cresc-2)*3+lawSum('conf')-(S.pol.tax.irpj-34)*.8-(S.wars.length?10:0)-e.shortIdx*.3-S.prot*.1+pulseSum('conf');
  e.conf+=(clamp(confT,0,100)-e.conf)*.15;e.conf=clamp(e.conf,0,100);
  e.prevAge+=.1/12;
  e.oneoffM=0;
}
function socialStep(){

  e.pobreza+=(clamp(pobT,2,70)-e.pobreza)*.06;

  const crT=100-(pctPIB(g.seguranca)-.15)*140+(e.desemp-5.8)*3+lawSum('crime')+(S.mil.glo>0?-10:0)+(S.mil.prog.fronteira&&S.mil.prog.fronteira.left===0?-5:0);

/* ---------- mundo e países ---------- */
function worldStep(){
  const w=S.w;
  w.oil12.push(w.oil);if(w.oil12.length>24)w.oil12.shift();
  w.oil=clamp(w.oil*(1+gauss()*.035)+(68-w.oil)*.03,25,180);
  w.worldG+=(3.0-w.worldG)*.08+gauss()*.08;
  w.chinaG+=(4.3-w.chinaG)*.06+gauss()*.08;
  const pi=S.pres.ideo;
  for(const c of COUNTRIES){
    const st=S.c[c.iso];
    const base=c.rel0-8*Math.abs(pi-c.ideo)+4+st.mod;
    st.rel+=(base-st.rel)*.03;
    st.mod*=.99;
    let harm=0;for(const s in c.imp){const t=st.st==='acordo'?0:tariffOf(s);harm+=c.imp[s]*Math.max(0,Math.min(t,100)-11.5)/88.5}
    if(st.st==='sancao')harm+=1;
    let xh=0;for(const s in c.exp){const p=S.pol.exp[s];xh+=c.exp[s]*(p==='proibido'?1:p==='taxa'?.3:0)}
    st.rel=clamp(st.rel-harm*1.6-xh*2.2,-100,100);
    if((harm>.18||xh>.3)&&st.rel<25){st.retal=Math.min(1,st.retal+.15);if(st.retal>=.45&&!st.announced){st.announced=true;news(`${c.n} retalia e sobretaxa produtos brasileiros`,'neg')}}
    else{st.retal=Math.max(0,st.retal-.05);if(st.retal<.1)st.announced=false}
    st.sancBR=Math.max(0,st.sancBR-.01);
    if(c.pers==='hostil'&&c.viz&&st.rel<-65&&!atWar(c.iso)&&rnd()<.02){startWar(c.iso,false)}
  }
  if(S.flags.mercosul)MERCOSUL.forEach(i=>{if(S.c[i].st!=='sancao'&&S.c[i].st!=='embargo')S.c[i].st='acordo'});
  if(S.flags.ftaUE)EU.forEach(i=>{if(S.c[i].st==='normal')S.c[i].st='acordo'});
  // defesa: estoque militar
  const defUS=S.pol.g.defesa/e_cambio();
  S.mil.stock+=(defUS*(1+lawSum('mil'))-S.mil.stock)*.03;
  for(const k in S.mil.prog){const p=S.mil.prog[k];if(p.left>0){p.left--;if(p.left===0){news(p.done,'pos');if(p.bonus)S.mil.stock*=1+p.bonus}}}
}
function e_cambio(){return S.e.cambio}
function milPow(iso){
  if(iso==='076'){let p=Math.sqrt(S.mil.stock)*(S.flags.nuke?1.08:1)*(1+(S.mil.mobil?.45:0));return p}
  return Math.sqrt(CBY[iso].mil);
}
function startWar(iso,aggr){
  const c=CBY[iso];
  S.wars.push({iso,score:0,months:0,mortos:0,aggr,stance:'normal'});
  S.c[iso].st='embargo';S.c[iso].rel=-100;
  if(aggr){
    for(const o of COUNTRIES)if(o.iso!==iso&&!S.c[o.iso].alianca)relC(o.iso,-18,true);
    if(!['hostil'].includes(c.pers)){['840'].concat(EU).forEach(i=>{S.c[i].sancBR=.8});news('EUA e União Europeia impõem sanções ao Brasil','neg')}
  }
  news(aggr?`Brasil declara guerra contra ${c.n}`:`${c.n} ataca o território brasileiro`, 'neg');
  moodG({all:aggr?2:8,militares:10});
  S.events.push({id:'guerra_ini',iso,aggr});
}
function warStep(){
  for(const war of [...S.wars]){
    const c=CBY[war.iso];
    war.months++;
    const d=c.viz?1:.3;
    let ours=milPow('076')*(.75+S.ap.bom/100*.5),theirs=milPow(war.iso);
    for(const o of COUNTRIES)if(S.c[o.iso].alianca&&o.iso!==war.iso)ours+=milPow(o.iso)*.25;
    if(war.aggr)ours*=d;else theirs*=d;
    const st=war.stance==='ofensiva'?3:war.stance==='defensiva'?-1.5:0;
    war.score=clamp(war.score+clamp(10*Math.log(ours/theirs),-12,12)+st+gauss()*4,-100,100);
    const inten=(war.stance==='ofensiva'?1.6:war.stance==='defensiva'?.6:1)*(c.viz?1:.4);
    war.mortos+=Math.round((30+rnd()*70)*inten*Math.max(.3,Math.sqrt(milPow(war.iso)/5)));
    moodG({all:war.months<=3?.8:-1.3,militares:war.months<=6?1:-.5});
    if(c.nuc&&war.score>45&&!war.nukeWarn){war.nukeWarn=true;S.events.push({id:'nuclear',iso:war.iso})}
    if(war.score>=85)endWar(war,'vitoria');
    else if(war.score<=-85)endWar(war,'derrota');
  }
}
function endWar(war,how){
  S.wars=S.wars.filter(w=>w!==war);
  const c=CBY[war.iso];S.c[war.iso].st='normal';
  if(how==='vitoria'){news(`${c.n} capitula; Brasil vence a guerra após ${war.months} meses`,'pos');moodG({all:8,militares:12});S.c[war.iso].rel=-60}
  else if(how==='derrota'){news(`Brasil é derrotado por ${c.n}; governo assina rendição`,'neg');moodG({all:-20,militares:-15});oneOff(80)}
  else{news(`Cessar-fogo entre Brasil e ${c.n} entra em vigor`,'neu');moodG({all:3});S.c[war.iso].rel=-40}
  S.mil.mobil=0;
  for(const i in S.c)S.c[i].sancBR=Math.min(S.c[i].sancBR,.3);
}

/* ---------- Congresso e leis ---------- */
function blocSupport(law,b){
  let inc=law.apoio&&law.apoio[b.k]!=null?law.apoio[b.k]:clamp(92-55*Math.abs((law.ideo||0)-b.ideo),5,95);
  if(b.k==='ctr')inc+=8;
  return clamp(.5*inc+.35*(S.cn.rel[b.k]+S.cn.boost[b.k])+.15*S.ap.bom*1.6,0,100);
}
const NEED={PL:[241,38],PLP:[257,41],PEC:[308,49],DL:[257,41]};
function vote(law){
  let cam=0,sen=0;const by={};
  for(const b of BLOCOS_CN){const P=blocSupport(law,b);const f=clamp((P-32)/38+gauss()*.06,.02,.98);by[b.k]=Math.round(b.cam*f);cam+=by[b.k];sen+=Math.round(b.sen*clamp(f+gauss()*.05,0,1))}
  const [nc,ns]=NEED[law.tipo]||NEED.PL;
  return {cam,sen,by,ok:cam>=nc&&sen>=ns,nc,ns};
}
function baseSeats(){let s=0;for(const b of BLOCOS_CN){s+=b.cam*clamp((S.cn.rel[b.k]+S.cn.boost[b.k]-30)/45,0,1)}return Math.round(s)}
function congressStep(){
  for(const b of BLOCOS_CN){
    const base=clamp(85-55*Math.abs(S.pres.ideo-b.ideo)+(b.k==='ctr'?5:0),5,90)+(S.ap.bom-35)*(b.k==='ctr'?.6:.3);
    S.cn.rel[b.k]+=(clamp(base,0,100)-S.cn.rel[b.k])*.05;
    S.cn.boost[b.k]*=.93;
  }
}
function submitLaw(law,opts={}){
  const tipo=law.tipo||'PL';
  const dur={PL:3,PLP:4,PEC:7,DL:1}[tipo]+Math.floor(rnd()*3);
  const item={...law,tipo,uid:Date.now()+Math.floor(rnd()*1e4),left:opts.mp?4:dur,total:opts.mp?4:dur,mp:!!opts.mp,urg:false,since:S.m};
  if(opts.mp){item.prog=0;S.leis.vigor.push({...item,since:S.m,prog:0,mpPending:true});log(`Medida Provisória editada: ${law.n}`);applyLawOnce(item,.5)}
  else log(`Projeto enviado ao Congresso: ${law.n} (${tipo})`);
  S.leis.tram.push(item);
  return item;
}
function lawStage(l){
  if(l.tipo==='DL')return 'Plenário';
  if(l.mp)return 'MP em vigor, aguardando votação';
  const f=1-l.left/l.total;
  return f<.35?'Comissões (CCJ)':f<.7?'Plenário da Câmara':'Senado Federal';
}
function lawsStep(){
  for(const l of [...S.leis.tram]){
    l.left-=l.urg?2:1;
    if(l.left>0)continue;
    const v=vote(l);
    S.leis.tram=S.leis.tram.filter(x=>x!==l);
    const rec={n:l.n,tipo:l.tipo,m:S.m,ok:v.ok,cam:v.cam,sen:v.sen,nc:v.nc,ns:v.ns,by:v.by};
    S.leis.hist.unshift(rec);
    if(l.tipo==='DL'){
      if(v.ok){news(`Congresso autoriza guerra contra ${CBY[l.iso].n} (${v.cam} votos)`,'neg');startWar(l.iso,true)}
      else news(`Congresso nega autorização para guerra (${v.cam} votos a favor)`,'neu');
      continue;
    }
    if(l.revoga){
      if(v.ok){const idx=S.leis.vigor.findIndex(x=>x.id===l.revoga);if(idx>=0){const old=S.leis.vigor[idx];S.leis.vigor.splice(idx,1);undoLaw(old)}news(`Congresso aprova revogação: ${l.n.replace('Revogação: ','')}`,'neu')}
      else news(`Congresso rejeita a revogação de ${l.n.replace('Revogação: ','')}`,'neu');
      continue;
    }
    if(l.mp){
      const inV=S.leis.vigor.find(x=>x.uid===l.uid);
      if(v.ok){if(inV)inV.mpPending=false;news(`Congresso converte a MP “${l.n}” em lei (${v.cam} votos)`,'pos');applyLawOnce(l,.5)}
      else{if(inV){S.leis.vigor=S.leis.vigor.filter(x=>x!==inV);undoLaw(inV,.5)}news(`MP “${l.n}” cai no Congresso e perde a validade`,'neg');moodG({all:-2})}
      continue;
    }
    if(v.ok){
      news(`Aprovada: ${l.n} (${v.cam} votos na Câmara, ${v.sen} no Senado)`,'pos');
      S.leis.vigor.push({...l,since:S.m,prog:0});
      applyLawOnce(l,1);
      if((l.const??85)<60&&rnd()<(100-(l.const??85))/100*.8)S.sched.push({m:S.m+2+Math.floor(rnd()*4),id:'stf',uid:l.uid,n:l.n});
    }else{news(`Câmara rejeita ${l.n}: ${v.cam} votos, precisava de ${v.nc}`,'neg');moodG({all:-1.5})}
  }
  for(const l of S.leis.vigor){l.prog=Math.min(1,(l.prog||0)+1/6)}
}
function applyLawOnce(l,f){
  if(l.gr){const o={};for(const k in l.gr)o[k]=l.gr[k]*.5*f;moodG(o);for(const k in l.gr)S.lawG[k]=(S.lawG[k]||0)+l.gr[k]*.6*f}
  if(l.rel)for(const k in l.rel)relC(k,l.rel[k]*f,true);
  if(f>=.5&&l.flag){
    if(l.flag==='bcOff')S.flags.bcAut=false;
    if(l.flag==='bcOn')S.flags.bcAut=true;
    if(l.flag==='ftaUE')S.flags.ftaUE=true;
    if(l.flag==='nuke')S.flags.nuke=true;
    if(l.flag.startsWith('fta:'))S.c[l.flag.slice(4)].st='acordo';
    if(l.flag.startsWith('ali:'))S.c[l.flag.slice(4)].alianca=true;
  }
  if(l.fx&&l.fx.oneoff&&f>=1)oneOff(-l.fx.oneoff*S.e.pibNom*10);
  if(l.ev)S.sched.push({m:S.m+2,id:l.ev});
  S.lawIdeo=(S.lawIdeo||[]);S.lawIdeo.push({ideo:l.ideo||0,wt:f,cost:l.area==='Costumes'||l.area==='Segurança'?1.5:1});
}
function undoLaw(l,f=1){
  if(l.gr){const o={};for(const k in l.gr)o[k]=-l.gr[k]*.3*f;moodG(o);for(const k in l.gr)S.lawG[k]=(S.lawG[k]||0)-l.gr[k]*.5*f}
  if(l.flag==='bcOff')S.flags.bcAut=true;
  if(l.flag==='bcOn')S.flags.bcAut=false;
  if(l.flag==='ftaUE')S.flags.ftaUE=false;
  if(l.flag==='nuke')S.flags.nuke=false;
}

/* ---------- aprovação ---------- */
function agentsStep(){
  const e=S.e,p=S.pol,pi=S.pres.ideo;
  // mercado de trabalho
  const lf=A.filter(a=>a.st==='formal'||a.st==='informal'||a.st==='desempregado');
  const un=lf.filter(a=>a.st==='desempregado');
  const target=Math.round(lf.length*e.desemp/100);
  let diff=target-un.length;
  const tag=dateShort(S.m);
  const churn=Math.round(lf.length*.006);
  const emp=lf.filter(a=>a.st!=='desempregado');
  for(let k=0;k<Math.max(0,diff)+churn;k++){const a=pick(emp);if(a.st==='desempregado')continue;a.prevSt=a.st;a.st='desempregado';a.ocupPrev=a.ocup;a.ocup='procurando emprego';a.lost=3;a.hist.push('perdeu o emprego em '+tag);a.g=groupsOf(a)}
  const un2=A.filter(a=>a.st==='desempregado');
  for(let k=0;k<Math.max(0,-diff)+churn&&un2.length;k++){const i=Math.floor(rnd()*un2.length);const a=un2.splice(i,1)[0];a.st=rnd()<.45?'formal':'informal';setOcup(a);a.hist.push('arrumou emprego como '+a.ocup+' em '+tag);a.g=groupsOf(a)}
  // termos comuns
  const T={
    infl:-(e.ipca-3.5)*1.6, emp:-(e.desemp-6)*1.3, grow:(e.cresc-1.5), crime:-(e.crime-100)*.2,
    saude:(e.saude-50)*.25, educ:(e.educ-50)*.2, corr:-(e.corrup-35)*.3, amb:-(e.desmat-5800)/260,
    short:-e.shortIdx*.3, honey:8*Math.max(0,1-S.m/9),
    social:(pctPIB(p.g.social)-2.2)*14, sm:clamp(e.smReal*.9,-15,15),
    taxRich:-(p.tax.irpf-27.5)*.6-(p.tax.irpj-34)*.3, taxMid:-(p.tax.iva-26.5)*.7+(p.tax.isencao-5000)/1000*1.2, taxBiz:-(p.tax.irpj-34)*.8-(p.tax.folha-20)*.6,
    selic:-(e.selic-10)*.35
  };
  const laws=(S.lawIdeo||[]);
  for(const a of A){
    let t=50+a.pers*1.4+30*(.55-Math.abs(a.ideo-pi))+T.honey+S.moodAll+(S.moodR[a.reg]||0);
    t+=a.w.infl*T.infl*(a.d<5?1.3:.8);
    t+=a.w.emp*T.emp+(a.st==='desempregado'?-10:0)+(a.lost>0?-6:0);
    t+=(a.st==='empresario'||a.st==='agro'?T.grow*2.2:T.grow*.7);
    t+=a.w.crime*T.crime+a.w.saude*T.saude+a.w.educ*T.educ+a.w.corrup*T.corr+a.w.amb*T.amb+T.short*(a.d<5?1.3:.8);
    t+=a.benef?T.social:T.social*.12;
    if(a.d<3||a.st==='aposentado')t+=T.sm;
    if(a.d>=8)t+=T.taxRich*a.w.imp;
    if(a.d>=3&&a.d<8)t+=T.taxMid*a.w.imp;
    if(a.st==='empresario')t+=T.taxBiz;
    if(a.d>=4&&a.d<9)t+=T.selic;
    for(const g of a.g)t+=((S.moodG[g]||0)+(S.lawG[g]||0))*.8;
    for(const l of laws)t+=l.wt*l.cost*a.w.cost*(.45-Math.abs(a.ideo-l.ideo))*4;
    if(a.lost>0)a.lost--;
    a.sat+=(clamp(t,0,100)-a.sat)*.2+gauss()*1.2;
    a.sat=clamp(a.sat,0,100);
  }
  // decaimento
  for(const k in S.moodG)S.moodG[k]*=.88;
  for(const k in S.lawG)S.lawG[k]*=.985;
  for(const k in S.moodR)S.moodR[k]*=.88;
  S.moodAll*=.88;
  for(const l of laws)l.wt*=.97;
  S.lawIdeo=laws.filter(l=>l.wt>.05);
  approval();
}
function approval(){
  let b=0,r=0,m=0,v=0;
  for(const a of A){if(a.sat>=60)b++;else if(a.sat>=40)r++;else m++;if(a.sat>=51)v++}
  const n=A.length;S.ap={bom:b/n*100,reg:r/n*100,ruim:m/n*100};S.voto=v/n*100;
  S.prot=clamp(S.ap.ruim-45,0,60)*1.6;
}
function apBy(fn){const L=A.filter(fn);if(!L.length)return 0;return L.filter(a=>a.sat>=60).length/L.length*100}

function impeachVote(){
  let yes=0;for(const b of BLOCOS_CN){const sup=S.cn.rel[b.k]+S.cn.boost[b.k];yes+=b.cam*clamp(1-(sup-15)/55+gauss()*.05,0,1)}
  yes=Math.round(yes);
  if(yes>=342){S.over={why:'impeachment',txt:`A Câmara aprovou o impeachment por ${yes} votos. O mandato termina em ${dateLbl(S.m)}.`}}
  else{S.impeach=true;news(`Impeachment é barrado na Câmara: ${yes} votos, eram necessários 342`,'pos')}
}
function eventsStep(){
  for(const s of [...S.sched])if(s.m<=S.m){S.sched=S.sched.filter(x=>x!==s);S.events.push({id:s.id,uid:s.uid,n:s.n})}
  let fired=0;
  for(const id in EVENTS){
    if(fired>=1)break;
    const ev=EVENTS[id];
    if(ev.once&&S.evUsed[id]!=null)continue;
    if(S.evUsed[id]!=null&&S.m-S.evUsed[id]<10)continue;
    if(rnd()<ev.w()){S.events.push({id});S.evUsed[id]=S.m;fired++}
  }
}
function resolveEvent(idx,opt){
  const ev=S.events[idx];const def=EVENTS[ev.id];
  def.ops[opt].f(ev);
  log(`Decisão sobre “${evTitle(ev)}”: ${def.ops[opt].t}`);
  S.events.splice(idx,1);
}
function evTitle(ev){if(ev.id==='stf')return `STF suspende “${ev.n}”`;if(ev.id==='guerra_ini')return `Guerra contra ${CBY[ev.iso].n}`;if(ev.id==='nuclear')return `${CBY[ev.iso].n} ameaça usar armas nucleares`;return EVENTS[ev.id].t}
function evDesc(ev){
  if(ev.id==='stf')return `Por 7 a 4, o Supremo considerou inconstitucional a lei “${ev.n}”. Os efeitos ficam suspensos.`;
  if(ev.id==='guerra_ini')return ev.aggr?`O Brasil está em guerra contra ${CBY[ev.iso].n}. Defina o tamanho do esforço de guerra.`:`${CBY[ev.iso].n} atacou posições brasileiras na fronteira. O país está em guerra.`;
  if(ev.id==='nuclear')return `Com suas tropas recuando, ${CBY[ev.iso].n} coloca o arsenal nuclear em alerta máximo e exige cessar-fogo em 48 horas.`;
  return EVENTS[ev.id].d;
}

function stepMonth(){
  S.log=S.log||[];S.newsM=S.newsM||[];
  policyChanges();
  tradeCalc();
  pricesStep();
  macroStep();
  socialStep();
  worldStep();
  warStep();
  lawsStep();
  congressStep();
  agentsStep();
  eventsStep();
  S.pulses.forEach(p=>p.left--);S.pulses=S.pulses.filter(p=>p.left>0);
  if(S.flags.ocde>0&&!S.flags.ocdeOn){if(S.e.cred>58)S.flags.ocde++;if(S.flags.ocde>=13){S.flags.ocdeOn=true;news('Brasil é aceito como membro pleno da OCDE','pos');S.e.conf+=6}}
  const decided=S.log.slice();
  S.summary=buildSummary(decided);
  S.lastLog=decided;
  S.m++;
  pushHist();
  // eleição
  if(ELECTIONS.includes(S.m-1)&&!S.over){
    const voto=clamp(S.voto+gauss()*2,0,100);
    S.election={m:S.m-1,voto};
    if(voto<50)S.over={why:'eleicao',txt:`Você teve ${fmtN(voto,1)}% dos votos válidos no segundo turno e perdeu a reeleição.`};
    else if(S.m-1===93)S.over={why:'fim',txt:`Você terminou dois mandatos com ${fmtN(S.ap.bom,0)}% de aprovação.`};
    else news(`Presidente é reeleito com ${fmtN(voto,1)}% dos votos válidos`,'pos');
  }
  S.log=[];
}
function buildSummary(dec){
  const h=S.hist,e=S.e;const L=[];
  const d=(k)=>h[k]&&h[k].length>1?e[k]-h[k][h[k].length-1]:0;
  if(Math.abs(d('ipca'))>.15)L.push(`Inflação ${d('ipca')>0?'subiu':'caiu'} para ${fmtN(e.ipca,1)}% em 12 meses.`);
  if(Math.abs(d('desemp'))>.1)L.push(`Desemprego ${d('desemp')>0?'subiu':'caiu'} para ${fmtN(e.desemp,1)}%.`);
  if(Math.abs(d('selic'))>=.25)L.push(`${S.flags.bcAut?'O Copom':'O governo'} ${d('selic')>0?'subiu':'cortou'} a Selic para ${fmtN(e.selic,2)}%.`);
  if(Math.abs(d('cambio'))>.12)L.push(`Dólar ${d('cambio')>0?'subiu':'caiu'} para R$ ${fmtN(e.cambio,2)}.`);
  if(e.shortIdx>15)L.push(`Há falta de produtos nas prateleiras (desabastecimento ${fmtN(e.shortIdx,0)}/100).`);
  return L;
}

const f1=v=>fmtN(v,1),f2=v=>fmtN(v,2),f0=v=>fmtN(v,0);
const sg=(v,d=1)=>(v>0?'+':v<0?'−':'')+fmtN(Math.abs(v),d);
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>el.hidden=true,3200)}
function spark(arr,col,opts={}){
  const a=(arr||[]).slice(-(opts.n||13));if(a.length<2)return `<svg viewBox="0 0 100 30"></svg>`;
  let mn=Math.min(...a),mx=Math.max(...a);if(mx-mn<1e-6){mx+=1;mn-=1}
  const X=i=>2+i*(96/(a.length-1)),Y=v=>27-(v-mn)/(mx-mn)*23;
  const pts=a.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ');
  return `<svg viewBox="0 0 100 30" preserveAspectRatio="none"><polygon points="2,29 ${pts} 98,29" fill="${col}" fill-opacity=".12"/><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.6" vector-effect="non-scaling-stroke"/><circle cx="${X(a.length-1)}" cy="${Y(a[a.length-1])}" r="2.2" fill="${col}"/></svg>`;
}
function avatar(a){const hue=(a.id*47)%360;const ini=a.nome.split(' ').map(x=>x[0]).slice(0,2).join('');return `<div class="av" style="background:hsl(${hue} 32% 64%)">${esc(ini)}</div>`}
function satLbl(s){return s>=60?['aprova','good']:s>=40?['regular','warn']:['reprova','bad']}
function ideoLbl(v){return v<-.35?'esquerda':v>.35?'direita':'centro'}
const pill=(t,c='')=>`<span class="pill ${c}">${t}</span>`;
function relCol(r){const t=(r+100)/200;const a=[184,65,47],b=[52,72,78],c=[63,156,110];const m=t<.5?a.map((x,i)=>x+(b[i]-x)*t*2):b.map((x,i)=>x+(c[i]-x)*(t-.5)*2);return `rgb(${m.map(Math.round).join(',')})`}

/* ---------- topo ---------- */
function renderTop(){
  {const d=dateLbl(S.m);$('#dateLbl').textContent=d.charAt(0).toUpperCase()+d.slice(1)}
  const nx=ELECTIONS.find(x=>x>=S.m);
  $('#electLbl').textContent=nx!=null?(nx===S.m?'Eleição neste mês':`Eleição em ${nx-S.m} ${nx-S.m===1?'mês':'meses'}`):'Fim do mandato';
  $('#presName').textContent=`${S.pres.nome} · governo de ${LADO_N[S.pres.lado]}`;
  const h=S.hist,e=S.e,prev=k=>h[k]&&h[k].length>1?h[k][h[k].length-2]:null;
  const K=[['PIB','cresc',f1(e.cresc)+'%',1],['IPCA','ipca',f1(e.ipca)+'%',-1],['Desemprego','desemp',f1(e.desemp)+'%',-1],['Selic','selic',f2(e.selic)+'%',0],['Dólar','cambio','R$ '+f2(e.cambio),-1],['Dívida/PIB','divida',f1(e.divida)+'%',-1],['Aprovação','ap',f0(S.ap.bom)+'%',1],['Base','base',baseSeats()+'/513',1]];
  $('#kpis').innerHTML=K.map(([l,k,v,good])=>{
    const cur=k==='ap'?S.ap.bom:k==='base'?baseSeats():e[k];const p=prev(k);let d='';
    if(p!=null){const dd=cur-p;const th=k==='base'?1:k==='cambio'?.01:.05;if(Math.abs(dd)>=th){const cls=good===0?'flat':(dd*good>0?'up':'dn');d=`<span class="d ${cls}">${dd>0?'▲':'▼'} ${k==='base'?Math.abs(Math.round(dd)):fmtN(Math.abs(dd),k==='cambio'?2:1)}</span>`}else d='<span class="d flat">—</span>'}
    return `<div class="kpi"><span class="l">${l}</span><span class="v">${v}</span>${d}</div>`}).join('');
  $('#tabs').innerHTML=TABS.map(([k,n])=>`<button role="tab" data-tab="${k}" aria-selected="${k===TAB}">${n}${k==='gabinete'&&S.events.length?'<i class="dot"></i>':''}${k==='defesa'&&S.wars.length?'<i class="dot"></i>':''}</button>`).join('');
}

function tEconomia(){
  const F=calcFiscal();const p=S.pol,e=S.e;
  const sl=(id,lbl,val,min,max,step,out,hint)=>`<div class="sl"><label for="${id}">${lbl}</label><output id="o_${id}">${out}</output><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}" data-bind="${id}">${hint?`<span class="hint">${hint}</span>`:''}</div>`;
  const rows=(o)=>Object.entries(o).filter(([k,v])=>Math.abs(v)>.004).map(([k,v])=>`<tr><td>${k}</td><td class="r num">${f2(v)}%</td><td class="r num">R$ ${f0(v*e.pibReal*10)} bi</td></tr>`).join('');
  return `
  <section class="sec"><h2>Economia e orçamento</h2><p class="muted small">Valores em R$ de 2027. As mudanças entram em vigor quando você encerra o mês.</p></section>
  <section class="sec"><h3>Resultado das contas <em>% do PIB ao ano</em></h3>
    <div class="grid3"><div class="stat"><span class="l">Primário</span><span class="v ${F.primario>=0?'up':'dn'}">${sg(F.primario,2)}%</span></div><div class="stat"><span class="l">Juros da dívida</span><span class="v">${f2(F.juros)}%</span></div><div class="stat"><span class="l">Nominal</span><span class="v dn">${sg(F.nominal,2)}%</span></div></div>
    <details><summary class="small muted" style="cursor:pointer">Receitas e despesas detalhadas</summary><div class="tw"><table><tr><th>Receita</th><th class="r">% PIB</th><th class="r">R$</th></tr>${rows(F.rec)}<tr><th>Despesa</th><th></th><th></th></tr>${rows(F.disc)}${rows(F.desp)}</table></div></details>
  </section>
  <section class="sec"><h3>Juros</h3>
    ${S.flags.bcAut?`<div class="box"><div class="row"><div class="sp"><b>Banco Central autônomo</b><div class="small muted">O Copom define a Selic seguindo a meta de inflação de 3%. Selic atual: <span class="num">${f2(e.selic)}%</span>.</div></div></div><div class="btns" style="margin-top:8px"><button class="btn" data-act="pressBC">Criticar os juros em público</button><button class="btn" data-act="preset" data-arg="bc">Enviar lei que revoga a autonomia</button></div></div>`
    :sl('selic','Selic definida pelo governo',p.selic,2,30,.25,f2(p.selic)+'%','Juros baixos aceleram o PIB mas alimentam inflação e dólar.')}

    ${sl('irpj','IR das empresas + CSLL',p.tax.irpj,15,50,1,f0(p.tax.irpj)+'%')}
    ${sl('iva','Imposto sobre consumo (IVA)',p.tax.iva,15,35,.5,f1(p.tax.iva)+'%','Pesa mais para os pobres e sobe preços.')}

function expVotes(l){let c=0;for(const b of BLOCOS_CN){c+=b.cam*clamp((blocSupport(l,b)-32)/38,.02,.98)}return Math.round(c)}
const FXL={receita:['Receita','% PIB',1],gasto:['Gasto','% PIB',-1],pot:['Crescimento potencial','pp',1],infl:['Inflação','pp',-1],desemp:['Desemprego','pp',-1],conf:['Confiança','',1],cred:['Credibilidade','',1],crime:['Crime','%',-1],desmat:['Desmatamento','%',-1],pobreza:['Pobreza','pp',-1],saude:['Saúde','',1],educ:['Educação','',1],corrup:['Corrupção','',-1],oneoff:['Receita única','% PIB',1],mil:['Poder militar','',1]};
function fxPills(l){
  const out=[];
  for(const k in (l.fx||{})){const v=l.fx[k];if(!v||!FXL[k])continue;const [n,u,g]=FXL[k];out.push(pill(`${n} ${sg(k==='mil'?v*100:v,Math.abs(v)<1?2:0)}${k==='mil'?'%':u?' '+u:''}`,v*g>0?'good':'bad'))}
  for(const k in (l.gr||{})){const v=l.gr[k];if(!v)continue;out.push(pill(`${GROUPS[k]} ${sg(v,0)}`,v>0?'good':'bad'))}
  for(const k in (l.rel||{})){const v=l.rel[k];if(!v)continue;out.push(pill(`${k==='UE'?'União Europeia':CBY[k]?.n||k} ${sg(v,0)}`,v>0?'good':'bad'))}
  return out.join(' ');
}

function concerns(a){
  const e=S.e;
  const c=[['a inflação',a.w.infl*Math.max(.3,e.ipca-2.5)*(a.d<5?1.3:.8)],['o emprego',a.w.emp*(a.st==='desempregado'?6:Math.max(.3,e.desemp-4))],['a violência',a.w.crime*Math.max(.3,e.crime/40)],['a saúde pública',a.w.saude*Math.max(.3,(60-e.saude)/6)],['a corrupção',a.w.corrup*Math.max(.3,e.corrup/12)],['o meio ambiente',a.w.amb*Math.max(.2,e.desmat/2500)],['os impostos',a.w.imp*1.2],['a falta de produtos',e.shortIdx/8]];
  if(a.w.cost>1.2)c.push(['os valores da família',a.w.cost*1.6]);
  return c.sort((x,y)=>y[1]-x[1]).slice(0,3).map(x=>x[0]);
}
function tPovo(){

const EXTRA_NATO=['008','056','100','191','203','208','233','246','300','348','352','428','440','442','499','807','578','616','642','703','705','752'];
function blocOf(iso){
  if(iso==='076')return S.flags.mercosul?'Mercosul':S.flags.brics?'BRICS':null;
  if(MERCOSUL.includes(iso))return 'Mercosul';
  const c=CBY[iso];
  if(c&&c.blocos.includes('BRICS'))return 'BRICS';
  if(EU.includes(iso)||EXTRA_EU.includes(iso))return 'UE';
  if((c&&c.blocos.includes('OTAN'))||EXTRA_NATO.includes(iso)||iso==='840'||iso==='124')return 'OTAN';
  if(iso==='231')return 'BRICS';
  return null;
}
function capColor(f){
  const iso=f.iso;
  if(atWar(iso))return '#E0452E';
  if(iso==='076')return f===HOVER?'#F2CD73':'#E2B54E';
  const c=CBY[iso];const hi=f===HOVER||iso===S.selC;
  let col='#1C2F35';
  if(MODE==='rel'&&c)col=relCol(S.c[iso].rel);
  if(MODE==='blocos'){const b=blocOf(iso);col=b?BLOCS.find(x=>x.k===b).col:'#1C2F35'}
  if(MODE==='comercio'&&c){const r=S.tradeRows?S.tradeRows[iso]:{x:c.x,m:c.m};const t=clamp(Math.log10(1+r.x+r.m)/2.25,0,1);col=`rgb(${Math.round(40+t*186)},${Math.round(60+t*121)},${Math.round(66+t*12)})`}
  if(MODE==='militar'&&c){const t=clamp(Math.log10(1+c.mil)/3,0,1);col=`rgb(${Math.round(35+t*76)},${Math.round(60+t*115)},${Math.round(72+t*136)})`}
  return hi?shade(col,.25):col;
}
function shade(c,k){const m=c.match(/\d+/g);if(!m||c.startsWith('#')){const h=c.replace('#','');const n=[0,2,4].map(i=>parseInt(h.substr(i,2),16));return `rgb(${n.map(v=>Math.round(v+(255-v)*k)).join(',')})`}return `rgb(${m.slice(0,3).map(v=>Math.round(+v+(255-v)*k)).join(',')})`}
function labelFor(f){
  const c=CBY[f.iso];
  if(f.iso==='076')return `<b>Brasil</b><br>Aprovação do governo: ${f0(S.ap.bom)}%`;
  if(!c)return `<b>${esc(f.name)}</b><br><span style="color:#8fa3a6">sem dados neste protótipo</span>`;
  const st=S.c[f.iso],r=S.tradeRows?S.tradeRows[f.iso]:{x:c.x,m:c.m};
  return `<b>${c.n}</b><br>Relação: ${sg(st.rel,0)}<br>Comércio: US$ ${f1(r.x+r.m)} bi/ano${atWar(f.iso)?'<br><b style="color:#E36C55">Em guerra</b>':''}`;
}
function altFor(f){return f.iso===S.selC?.035:f===HOVER?.025:f.iso==='076'?.016:.007}
function arcs(){
  const out=[];const br=[-15.8,-47.9];
  if(MODE==='comercio'){
    COUNTRIES.map(c=>({c,v:S.tradeRows?S.tradeRows[c.iso].x+S.tradeRows[c.iso].m:c.x+c.m})).sort((a,b)=>b.v-a.v).slice(0,12).forEach(({c,v})=>{
      const st=S.c[c.iso].st;out.push({a:br,b:[c.lat,c.lng],w:clamp(v/40,.25,2.2),col:st==='acordo'?['rgba(226,181,78,.95)','rgba(226,181,78,.35)']:st==='normal'?['rgba(111,175,208,.9)','rgba(111,175,208,.3)']:['rgba(227,108,85,.9)','rgba(227,108,85,.3)'],t:3200})});
  }
  for(const w of S.wars){const c=CBY[w.iso];out.push({a:br,b:[c.lat,c.lng],w:1.6,col:['#E0452E','#FFB199'],t:900})}
  for(const c of COUNTRIES)if(S.c[c.iso].alianca)out.push({a:br,b:[c.lat,c.lng],w:.6,col:['rgba(226,181,78,.8)','rgba(226,181,78,.8)'],t:6000});
  return out;
}
function updateGlobe(){
  if(!world)return;
  world.polygonCapColor(capColor).polygonAltitude(altFor).arcsData(arcs());
  const L=$('#legend');
  if(MODE==='rel')L.innerHTML=`<div>Relação com o Brasil</div><div class="grad"></div><div class="row" style="justify-content:space-between;width:180px"><span>hostil</span><span>neutra</span><span>aliada</span></div>`;
  if(MODE==='blocos')L.innerHTML=BLOCS.map(b=>`<div class="row"><span class="sw" style="background:${b.col}"></span>${b.k}</div>`).join('');
  if(MODE==='comercio')L.innerHTML=`<div>Comércio com o Brasil</div><div class="row"><span class="sw" style="background:#E2B54E"></span>livre comércio</div><div class="row"><span class="sw" style="background:#6FAFD0"></span>tarifas normais</div><div class="row"><span class="sw" style="background:#E36C55"></span>sanções</div>`;
  if(MODE==='militar')L.innerHTML=`<div>Gasto militar (escala log)</div><div class="grad" style="background:linear-gradient(90deg,#233c48,#6FAFD0)"></div>`;
}
function setupGlobe(){
  const el=$('#globe');
  if(typeof Globe!=='function'){el.innerHTML='<p class="muted" style="padding:60px 20px;text-align:center">O globo 3D não carregou. O jogo continua pelo painel.</p>';return}
  world=Globe({animateIn:false})(el)
    .backgroundColor('rgba(0,0,0,0)')
    .showAtmosphere(true).atmosphereColor('#5fa9c4').atmosphereAltitude(.17)
    .showGraticules(true)
    .polygonsData(FEATURES)
    .polygonCapColor(capColor).polygonSideColor(()=>'rgba(8,16,20,.7)').polygonStrokeColor(()=>'rgba(11,20,24,.85)')
    .polygonAltitude(altFor).polygonsTransitionDuration(250)
    .polygonLabel(labelFor)
    .onPolygonClick(f=>{selectCountry(f.iso,false)})
    .onPolygonHover(f=>{HOVER=f;el.style.cursor=f?'pointer':'grab';world.polygonCapColor(capColor).polygonAltitude(altFor)})
    .arcStartLat(d=>d.a[0]).arcStartLng(d=>d.a[1]).arcEndLat(d=>d.b[0]).arcEndLng(d=>d.b[1])
    .arcColor(d=>d.col).arcStroke(d=>d.w).arcDashLength(.45).arcDashGap(.25).arcDashAnimateTime(d=>d.t).arcAltitudeAutoScale(.4);
  try{const m=world.globeMaterial();m.color.set('#0f232b');if(m.emissive)m.emissive.set('#071217');m.shininess=6}catch(e){}
  world.pointOfView({lat:-12,lng:-48,altitude:2.25},0);
  const ro=new ResizeObserver(()=>world.width(el.clientWidth).height(el.clientHeight));ro.observe(el);
  updateGlobe();
}
function selectCountry(iso,fly){
  S.selC=iso;CONFIRM=null;
  if(TAB!=='mundo'){TAB='mundo'}
  render();updateGlobe();
  if(fly&&world){const c=CBY[iso];if(c)world.pointOfView({lat:c.lat,lng:c.lng,altitude:2.1},900)}
}

function profileText(a){

  return `${a.nome}, ${a.idade} anos, ${a.sexo==='F'?'mulher':'homem'}, mora em ${a.cid} (${REGIOES[a.reg].n}). Ocupação: ${a.ocup} (${sit}). Renda mensal ~R$ ${f0(a.renda)}. ${a.benef?'Recebe Bolsa Família. ':''}${a.evang?'Evangélico(a). ':''}Posição política: ${ideoLbl(a.ideo)}. Satisfação com o governo: ${f0(a.sat)}/100 (${satLbl(a.sat)[0]}). Mais preocupado(a) com: ${concerns(a).join(', ')}.${a.hist.length?' Fatos recentes: '+a.hist.slice(-3).join('; ')+'.':''}`;

function aiFail(e){
  const hard=['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'];
  if(e&&hard.includes(e.code)){AI_OK=false;toast('A IA não está disponível aqui. O jogo segue com textos automáticos.')}
  else if(e&&e.code==='rate_limited')toast('Limite de uso da IA atingido. Tente de novo mais tarde.');
  else if(e&&e.code!=='cancelled')toast('A IA não respondeu desta vez.');
}

function offlinePost(a){
  const c=concerns(a)[0],good=a.sat>=60,bad=a.sat<40,e=S.e;
  if(a.st==='desempregado')return pick(['Mais um mês mandando currículo e nada. Tá difícil.','Tô fazendo bico pra pagar o aluguel enquanto não aparece nada fixo.']);
  const T={'a inflação':bad?[`O mercado tá um absurdo. Com ${f1(e.ipca)}% de inflação o dinheiro some antes do dia 20.`,'Cada ida ao mercado é um susto.']:good?['Os preços deram uma segurada, já dá pra respirar.']:['O preço das coisas ainda pesa, mas já foi pior.'],
    'o emprego':bad?['Aqui na firma todo mundo com medo de corte.']:['Tem vaga aparecendo de novo por aqui.'],
    'a violência':['Não dá pra andar tranquilo depois das 8 da noite no meu bairro.','Assaltaram meu vizinho de novo. Cadê a polícia?'],
    'a saúde pública':['Três meses esperando uma consulta no posto.','Fila no hospital desde as 5 da manhã.'],
    'a corrupção':['Mais um escândalo e ninguém vai preso.','Político é tudo igual, só muda o partido.'],
    'o meio ambiente':e.desmat<5000?['Pelo menos o desmatamento caiu, é um começo.']:['Enquanto isso a floresta queimando.'],
    'os impostos':['Trabalho quatro meses por ano só pra pagar imposto.','Imposto de primeiro mundo e serviço de terceiro.'],
    'a falta de produtos':['Rodei três mercados atrás de arroz e nada.','Congelaram o preço e sumiu tudo da prateleira.'],
    'os valores da família':['Governo tinha que cuidar da economia e deixar a família em paz.']};
  return pick(T[c]||['Seguindo a vida por aqui.']);
}

async function analisar(){
  const txt=($('#leiTxt')?.value||'').trim();
  if(txt.length<12)return toast('Escreva a proposta com um pouco mais de detalhe.');
  const names=COUNTRIES.map(c=>c.n).join(', ');
  const prompt=`Você é a Casa Civil em um jogo de simulação do governo brasileiro (ficção). Analise a proposta do Presidente como um técnico realista em economia, direito constitucional e política.
Contexto atual:
${ctxText()}
Proposta do Presidente: """${txt.slice(0,2000)}"""
Devolva só JSON com este formato:
{"titulo":"nome oficial curto","tipo":"PL|PLP|PEC","resumo":"2 frases sobre o que a lei faz na prática","parecer":"2 a 3 frases com prós, contras e riscos","ideologia":0,"constitucionalidade":0,"mp_possivel":false,
"efeitos":{"receita":0,"gasto":0,"pot":0,"infl":0,"desemp":0,"conf":0,"cred":0,"crime":0,"desmat":0,"pobreza":0,"saude":0,"educ":0,"corrup":0},
"grupos":{${Object.keys(GROUPS).map(k=>`"${k}":0`).join(',')}},

Escalas: ideologia de -1 (esquerda) a 1 (direita); constitucionalidade 0-100 (chance de o STF manter); receita e gasto em % do PIB por ano (-2 a 2); pot = pontos percentuais de crescimento potencial (-0.6 a 0.6); infl e desemp em pontos percentuais (-1.5 a 1.5); conf e cred de -20 a 20; crime e desmat em % (-50 a 50); pobreza em pontos percentuais (-5 a 5); saude, educ e corrup de -10 a 10; grupos = mudança de humor de -30 a 30; relacoes: use só países desta lista ou "União Europeia": ${names}; apoio = inclinação de cada bloco do Congresso (esquerda, centro-esquerda, Centrão, centro-direita, direita) de 0 a 100. Medida provisória não pode ser PEC, lei complementar, direito penal ou matéria eleitoral. Seja realista: medidas populistas têm custo fiscal, e propostas absurdas ou inconstitucionais têm constitucionalidade baixa. Omita o que for zero.`;

function normAcc(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim()}
function normLaw(j,txt){
  const R={receita:[-2,2],gasto:[-2,2],pot:[-.6,.6],infl:[-1.5,1.5],desemp:[-1.5,1.5],conf:[-20,20],cred:[-20,20],crime:[-50,50],desmat:[-50,50],pobreza:[-5,5],saude:[-10,10],educ:[-10,10],corrup:[-10,10]};
  const fx={};for(const k in R){const v=+(j.efeitos||{})[k];if(isFinite(v)&&v)fx[k]=clamp(v,...R[k])}
  const gr={};for(const k in GROUPS){const v=+(j.grupos||{})[k];if(isFinite(v)&&v)gr[k]=clamp(Math.round(v),-30,30)}
  const rel={};for(const [k,v] of Object.entries(j.relacoes||{})){const n=normAcc(k);let iso=null;if(n.includes('uniao europeia')||n==='ue')iso='UE';else{const c=COUNTRIES.find(c=>normAcc(c.n)===n||n.includes(normAcc(c.n)));if(c)iso=c.iso;if(n==='eua'||n.includes('estados unidos'))iso='840'}if(iso&&isFinite(+v)&&+v)rel[iso]=clamp(Math.round(+v),-30,30)}
  const apoio={};let has=false;for(const b of BLOCOS_CN){const v=+(j.apoio||{})[b.k];if(isFinite(v)){apoio[b.k]=clamp(v,0,100);has=true}}
  const tipo=['PL','PLP','PEC'].includes(j.tipo)?j.tipo:'PL';
  return {id:'custom_'+Date.now(),n:String(j.titulo||'Lei sem título').slice(0,100),tipo,ideo:clamp(+j.ideologia||0,-1,1),area:'Proposta própria',txt:String(j.resumo||txt).slice(0,500),parecer:String(j.parecer||'').slice(0,600),fx,gr,rel,apoio:has?apoio:null,const:clamp(+j.constitucionalidade||70,0,100),mpOk:!!j.mp_possivel&&tipo==='PL',custom:true};
}
