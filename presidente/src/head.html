<title>Mandato Presidencial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg:#0B1418; --bg2:#0F1C21; --bg3:#152830; --bg4:#1B323B;
  --line:#203740; --line2:#2D4A55;
  --ink:#E9E3D1; --ink2:#AAB8B6; --ink3:#71868B;
  --gold:#E2B54E; --gold-d:#8F6F26; --gold-bg:rgba(226,181,78,.12);
  --good:#63BA8C; --bad:#E36C55; --warn:#E3A04A; --info:#6FAFD0;
  --serif:"Newsreader", Georgia, "Times New Roman", serif;
  --ui:"IBM Plex Sans Condensed", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:6px;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.4}
*{box-sizing:border-box}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
#app{height:100%;display:grid;grid-template-rows:auto 1fr;min-height:0}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:16px;padding:10px 16px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0F1D22,#0B1418)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.seal{width:34px;height:34px;flex:none;border-radius:50%;border:1.5px solid var(--gold);display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#1d3a43,#0d1a1f)}
.seal svg{width:20px;height:20px}
.brand .t{font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:.01em;line-height:1.1}
.brand .sub{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.date{display:flex;flex-direction:column;line-height:1.15;padding-left:14px;border-left:1px solid var(--line)}
.date b{font-family:var(--serif);font-weight:600;font-size:16px}
.date span{font-size:12px;color:var(--ink3)}
.kpis{flex:1;display:flex;gap:4px;overflow-x:auto;min-width:0;scrollbar-width:none}
.kpis::-webkit-scrollbar{display:none}
.kpi{flex:none;padding:3px 10px;border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:78px}
.kpi .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);white-space:nowrap}
.kpi .v{font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .d{font-family:var(--mono);font-size:11px}
.up{color:var(--good)} .dn{color:var(--bad)} .flat{color:var(--ink3)}
.primary{background:var(--gold);color:#1a1405;border:0;border-radius:var(--r);padding:10px 16px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.primary:hover{filter:brightness(1.08)}
.primary:disabled{opacity:.5;cursor:wait}

/* ---------- main ---------- */
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(400px,520px);min-height:0}
.panel,.stage,.top>*{min-width:0}
.stage{position:relative;min-height:0;overflow:hidden;background:radial-gradient(ellipse at 45% 50%,#12252c 0%,#0B1418 70%)}
#globe{position:absolute;inset:0}
.mapmodes{position:absolute;top:12px;left:12px;display:flex;gap:4px;flex-wrap:wrap;z-index:2}
.chip{background:rgba(15,28,33,.85);border:1px solid var(--line2);border-radius:999px;padding:5px 11px;font-size:12.5px;color:var(--ink2)}
.chip[aria-pressed="true"]{border-color:var(--gold);color:var(--gold);background:rgba(40,32,12,.8)}
.legend{position:absolute;left:12px;bottom:12px;z-index:2;background:rgba(11,20,24,.82);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;font-size:12px;color:var(--ink2);display:flex;flex-direction:column;gap:4px;max-width:250px}
.legend .row{display:flex;align-items:center;gap:6px}
.sw{width:11px;height:11px;border-radius:2px;flex:none}
.grad{height:8px;border-radius:4px;background:linear-gradient(90deg,#B8412F,#3A4C52,#3F9C6E);width:180px}
.ticker{position:absolute;right:12px;bottom:12px;left:auto;z-index:2;max-width:min(420px,60%);display:flex;flex-direction:column;gap:6px;pointer-events:none}
.tick{background:rgba(11,20,24,.88);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:4px;padding:7px 10px;font-family:var(--serif);font-size:14px;line-height:1.3;animation:tin .5s ease both}
.tick small{display:block;font-family:var(--ui);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.tick.neg{border-left-color:var(--bad)} .tick.pos{border-left-color:var(--good)}
@keyframes tin{from{transform:translateY(6px);opacity:.3}to{transform:none;opacity:1}}
.float-tooltip-kap{background:rgba(11,20,24,.95)!important;border:1px solid var(--line2);border-radius:6px;padding:7px 10px!important;font-family:var(--ui)!important;font-size:12.5px!important;color:var(--ink)!important}
.float-tooltip-kap b{font-family:var(--serif);font-size:14px}

/* ---------- panel ---------- */
.panel{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line);background:var(--bg2)}
.tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:thin;flex:none}
.tabs button{flex:none;background:none;border:0;border-bottom:2px solid transparent;padding:10px 8px 8px;color:var(--ink3);font-size:13px;font-weight:500;letter-spacing:.02em;position:relative}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.tabs button .dot{position:absolute;top:7px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--bad)}
.body{flex:1;overflow-y:auto;padding:14px 16px 40px;display:flex;flex-direction:column;gap:18px}
h2{font-family:var(--serif);font-weight:600;font-size:20px;margin:0;text-wrap:balance;line-height:1.15}
h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink3);margin:0 0 8px;font-weight:600;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h3 em{font-style:normal;text-transform:none;letter-spacing:0;color:var(--ink3);font-weight:400;font-size:12px}
p{margin:0}
.muted{color:var(--ink3)} .small{font-size:12.5px}
.sec{display:flex;flex-direction:column;gap:8px}
.box{background:var(--bg3);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg3);border:1px solid var(--line);border-radius:var(--r);padding:9px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .l{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em}
.stat .v{font-family:var(--mono);font-size:17px;font-variant-numeric:tabular-nums}
.stat svg{display:block;width:100%;height:30px;margin-top:3px}
.btn{background:var(--bg4);border:1px solid var(--line2);border-radius:var(--r);padding:7px 11px;font-size:13px;color:var(--ink)}
.btn:hover{border-color:var(--gold-d)}
.btn.gold{border-color:var(--gold-d);color:var(--gold)}
.btn.danger{border-color:#6b2e24;color:#F08B75}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.row{display:flex;align-items:center;gap:8px}
.sp{flex:1}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line2);color:var(--ink2);white-space:nowrap}
.pill.good{border-color:#2f6a4c;color:var(--good)} .pill.bad{border-color:#743427;color:var(--bad)} .pill.warn{border-color:#6f5222;color:var(--warn)} .pill.gold{border-color:var(--gold-d);color:var(--gold)}

/* sliders */
.sl{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.sl label{font-size:13px}
.sl output{font-family:var(--mono);font-size:13px;color:var(--gold);text-align:right;font-variant-numeric:tabular-nums}
.sl input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--gold);height:18px}
.sl .hint{grid-column:1/-1;font-size:11.5px;color:var(--ink3)}
select{background:var(--bg4);border:1px solid var(--line2);border-radius:4px;padding:4px 6px;font-size:12.5px;max-width:100%}
textarea,input[type=text]{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:var(--r);padding:9px 10px;font-size:14px;line-height:1.4}
textarea{min-height:92px;resize:vertical;font-family:var(--serif);font-size:15px}

/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-weight:500;color:var(--ink3);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:5px 4px;border-bottom:1px solid var(--line2)}
td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
tr.click{cursor:pointer} tr.click:hover td{background:var(--bg3)}

/* bars */
.bar{height:6px;border-radius:3px;background:var(--bg4);overflow:hidden;position:relative}
.bar i{position:absolute;top:0;bottom:0;left:0;border-radius:3px}
.hb{display:grid;grid-template-columns:110px 1fr 42px;gap:8px;align-items:center;font-size:12.5px;padding:2px 0}
.hb .bar{height:9px}
.stack{display:flex;height:14px;border-radius:3px;overflow:hidden;gap:1px}
.stack i{display:block;height:100%}

/* feed */
.feed{display:flex;flex-direction:column;gap:8px}
.news{border-left:3px solid var(--line2);padding:2px 0 2px 10px}
.news.neg{border-left-color:var(--bad)} .news.pos{border-left-color:var(--good)}
.news small{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.news p{font-family:var(--serif);font-size:16px;line-height:1.25}
.post{display:grid;grid-template-columns:34px 1fr;gap:9px;padding:9px 0;border-bottom:1px solid var(--line)}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;color:#10181b}
.post .who{font-size:12.5px;color:var(--ink2)} .post .who b{color:var(--ink)}
.post p{font-size:14px;margin-top:2px}
.post .meta{font-size:11.5px;color:var(--ink3);margin-top:3px}

/* laws */
.law{background:var(--bg3);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.law .n{font-family:var(--serif);font-size:16px;font-weight:600;line-height:1.2}
.law .fx{display:flex;flex-wrap:wrap;gap:4px}
.decree{background:#EFE8D4;color:#1E1B14;border-radius:4px;padding:14px 16px;font-family:var(--serif);display:flex;flex-direction:column;gap:8px;box-shadow:0 1px 0 rgba(0,0,0,.4)}
.decree .hd{font-family:var(--ui);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#6A5A2F;border-bottom:1px solid #CFC39F;padding-bottom:6px;display:flex;justify-content:space-between}
.decree h4{margin:0;font-size:19px;line-height:1.2}
.decree p{font-size:14.5px;line-height:1.4}
.decree .fx .pill{border-color:#BBAE88;color:#3b3526}
.decree .fx .pill.good{color:#1f6a43;border-color:#8fbfa3} .decree .fx .pill.bad{color:#9a2f1d;border-color:#d99a8c}
.decree .btn{background:#1E1B14;color:#EFE8D4;border-color:#1E1B14}
.decree .btn.alt{background:transparent;color:#1E1B14;border-color:#8b7d55}

/* chat */
.chat{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto;padding-right:4px}
.msg{padding:8px 11px;border-radius:10px;max-width:88%;font-size:14px;line-height:1.4;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--gold-bg);border:1px solid var(--gold-d)}
.msg.them{align-self:flex-start;background:var(--bg4);border:1px solid var(--line2)}
.msg.sys{align-self:center;font-size:12px;color:var(--ink3);background:none;padding:2px}

/* people */
.cit{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.cit .av{width:40px;height:40px;font-size:14px}
.cit .nm{font-weight:600}
.cit .ds{font-size:12px;color:var(--ink3)}
.mood{font-family:var(--mono);font-size:13px}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(5,10,12,.72);display:grid;place-items:center;padding:16px;backdrop-filter:blur(2px)}
.card{background:var(--bg2);border:1px solid var(--line2);border-radius:10px;max-width:560px;width:100%;max-height:calc(100% - 20px);overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.card .kick{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.card h2{font-size:25px}
.card p.lead{font-family:var(--serif);font-size:16.5px;line-height:1.4;color:var(--ink)}
.opt{display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--bg3);border:1px solid var(--line2);border-radius:var(--r);padding:10px 12px}
.opt:hover{border-color:var(--gold)}
.opt b{font-weight:600;font-size:14.5px}
.opt span{font-size:12.5px;color:var(--ink3)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{background:var(--bg3);border:1px solid var(--line2);border-radius:var(--r);padding:10px 8px;text-align:left;display:flex;flex-direction:column;gap:2px}
.seg button[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-bg)}
.seg b{font-size:14px} .seg span{font-size:11.5px;color:var(--ink3)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--bg4);border:1px solid var(--gold-d);color:var(--ink);padding:9px 14px;border-radius:8px;font-size:13.5px;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.4)}
.ai{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink3)}
.ai i{width:7px;height:7px;border-radius:50%;background:var(--ink3)}
.ai.on i{background:var(--good);box-shadow:0 0 6px var(--good)}
.ai.busy i{background:var(--gold);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.warbar{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--bad) 0 50%,var(--good) 50% 100%);position:relative;opacity:.9}
.warbar b{position:absolute;top:-3px;width:4px;height:18px;background:var(--ink);border-radius:2px;transform:translateX(-2px)}

@media (max-width: 900px){
  #app{height:auto;min-height:100%}
  html,body{height:auto}
  .top{flex-wrap:wrap;gap:10px}
  .kpis{order:3;flex-basis:100%}
  .top .primary{order:2}
  .date{border-left:0;padding-left:0}
  .top .primary{margin-left:auto}
  main{grid-template-columns:minmax(0,1fr)}
  .stage{height:52vh;min-height:320px}
  .panel{border-left:0;border-top:1px solid var(--line)}
  .body{overflow:visible}
  .ticker{max-width:calc(100% - 24px);left:12px;right:12px;bottom:12px}
  .legend{display:none}
  .tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg2)}
}
@media (max-width:480px){
  .grid3{grid-template-columns:1fr 1fr}
  .seg{grid-template-columns:1fr}
  .brand .sub{max-width:160px}
  .hb{grid-template-columns:90px 1fr 38px}
}
@media (prefers-reduced-motion: reduce){ .tick{animation:none} .ai.busy i{animation:none} }
</style>

<div id="app">
  <header class="top">
    <div class="brand">
      <div class="seal" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M10 1.8l2.2 5 5.4.4-4.1 3.5 1.3 5.3L10 13.2 5.2 16l1.3-5.3L2.4 7.2l5.4-.4z" fill="none" stroke="#E2B54E" stroke-width="1.2"/></svg></div>
      <div><div class="t">Mandato Presidencial</div><div class="sub" id="presName">República Federativa do Brasil</div></div>
    </div>
    <div class="date"><b id="dateLbl">janeiro de 2027</b><span id="electLbl"></span></div>
    <div class="kpis" id="kpis"></div>
    <button id="nextBtn" class="primary">Encerrar o mês</button>
  </header>
  <main>
    <section class="stage" aria-label="Globo">
      <div id="globe"></div>
      <div class="mapmodes" id="mapmodes">
        <button class="chip" data-mode="rel" aria-pressed="true">Relações</button>
        <button class="chip" data-mode="blocos" aria-pressed="false">Blocos</button>
        <button class="chip" data-mode="comercio" aria-pressed="false">Comércio</button>
        <button class="chip" data-mode="militar" aria-pressed="false">Poder militar</button>
      </div>
      <div class="legend" id="legend"></div>
      <div class="ticker" id="ticker"></div>
    </section>
    <aside class="panel">
      <nav class="tabs" id="tabs" role="tablist"></nav>
      <div class="body" id="body"></div>
    </aside>
  </main>
</div>
<div class="modal" id="modal" hidden><div class="card" id="modalCard"></div></div>
<div class="toast" id="toast" hidden></div>
